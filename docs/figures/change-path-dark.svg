<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 481.2" width="880" height="481.2" role="img" aria-label="On a governed goatnet a change to network access is a pull request that adds a grant, a hold or a release under ops/warrant/membership/&lt;scope&gt;/. CI refuses sixteen kinds of bad declaration and grades the diff: one that only takes access away merges on one owner's click, one that gives access waits for review. After merge a converger running as a machine account makes the NetBird groups match every five minutes and puts back hand edits. The everyday dashboard reaches the management API through a read-only door: GET returns 200, POST returns 403."><title>Network access changes through a reviewed diff, not the dashboard</title><style>svg{--ink:#e7e9ec; --quiet:#a5acb7; --rule:#30363e; --line:#7b8592; --paper:#121417; --panel:#1a1d21; --accent:#6cc3da; --accent-soft:#14303a; --on-accent:#121417; --good:#6fc480; --good-bg:#1b2e20; --warn:#e2b04e; --warn-bg:#32291a; --info:#86b3ea; --info-bg:#1a2636; --crit:#f08b80; --crit-bg:#3a1f1f; font-family:'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif}.t{fill:var(--ink)} .tq{fill:var(--quiet)} .ta{fill:var(--accent)} .tg{fill:var(--good)}
.tw{fill:var(--warn)} .ti{fill:var(--info)} .tc{fill:var(--crit)} .ton{fill:var(--on-accent)}
.bx{fill:var(--panel);stroke:var(--line);stroke-width:1.25} .bxa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.bxg{fill:var(--good-bg);stroke:var(--good);stroke-width:1.25} .bxc{fill:var(--crit-bg);stroke:var(--crit);stroke-width:1.25}
.bxw{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1.25} .bxi{fill:var(--info-bg);stroke:var(--info);stroke-width:1.25}
.zone{fill:none;stroke:var(--line);stroke-width:1.25;stroke-dasharray:6 5}
.ln{stroke:var(--line);stroke-width:1.5;fill:none} .lna{stroke:var(--accent);stroke-width:2.25;fill:none}
.lng{stroke:var(--good);stroke-width:2;fill:none} .lnc{stroke:var(--crit);stroke-width:2;fill:none;stroke-dasharray:4 4}
.lni{stroke:var(--info);stroke-width:2;fill:none} .lnr{stroke:var(--rule);stroke-width:1;fill:none}
.fa{fill:var(--accent)} .fl{fill:var(--line)} .fg{fill:var(--good)} .fc{fill:var(--crit)} .fi{fill:var(--info)}
.halo{paint-order:stroke fill;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}</style>
<text x="24" y="38" class="t" font-size="20" font-weight="700" data-role="note">Network access changes through a reviewed diff, not the dashboard</text>
<text x="24" y="66" class="tq" font-size="15" data-role="note">On a governed goatnet, which peer holds which group is declared in git. A machine account makes the network match</text>
<text x="24" y="87" class="tq" font-size="15" data-role="note">it; the dashboard only reads.</text>
<rect x="24" y="127" width="190" height="134.2" rx="8" class="bxa"/>
<rect x="36" y="140.6" width="31" height="30" rx="15" class="fa"/>
<text x="51.5" y="160.2" class="ton" font-size="13" text-anchor="middle" font-weight="700">05</text>
<text x="75" y="161" class="t" font-size="15" font-weight="700">Pull request</text>
<text x="36" y="187.7" class="tq" font-size="14">a grant, hold or release</text>
<text x="36" y="211" class="tq" font-size="13" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace">ops/warrant/</text>
<text x="36" y="229" class="tq" font-size="13" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace">membership/&lt;scope&gt;/</text>
<rect x="238" y="127" width="190" height="134.2" rx="8" class="bx"/>
<rect x="250" y="140.6" width="31" height="30" rx="15" class="fa"/>
<text x="265.5" y="160.2" class="ton" font-size="13" text-anchor="middle" font-weight="700">02</text>
<text x="289" y="161" class="t" font-size="15" font-weight="700">CI refuses</text>
<text x="250" y="187.7" class="tq" font-size="14">sixteen kinds of bad</text>
<text x="250" y="207" class="tq" font-size="14">declaration, each with</text>
<text x="250" y="226.3" class="tq" font-size="14">the reason the rule exists</text>
<rect x="452" y="127" width="190" height="134.2" rx="8" class="bx"/>
<rect x="464" y="140.6" width="31" height="30" rx="15" class="fa"/>
<text x="479.5" y="160.2" class="ton" font-size="13" text-anchor="middle" font-weight="700">01</text>
<text x="503" y="161" class="t" font-size="15" font-weight="700">Converger</text>
<text x="464" y="186.7" class="tq" font-size="13" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace">goat warrant</text>
<text x="464" y="204.6" class="tq" font-size="13" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace">apply --membership</text>
<text x="464" y="228.6" class="tq" font-size="14">a machine account,</text>
<text x="464" y="247.9" class="tq" font-size="14">every five minutes</text>
<rect x="666" y="127" width="190" height="134.2" rx="8" class="bxg"/>
<text x="678" y="154" class="t" font-size="15" font-weight="700">NetBird groups match</text>
<text x="678" y="173.7" class="tq" font-size="14">a hand edit is put back</text>
<text x="678" y="193" class="tq" font-size="14">on the next pass</text>
<path d="M215 155L237 155" class="lna"/>
<path d="M237 155L227 160L227 150z" class="fa"/>
<path d="M429 155L451 155" class="lna"/>
<path d="M451 155L441 160L441 150z" class="fa"/>
<path d="M643 155L665 155" class="lna"/>
<path d="M665 155L655 160L655 150z" class="fa"/>
<rect x="24" y="276.2" width="31" height="30" rx="15" class="fa"/>
<text x="39.5" y="295.8" class="ton" font-size="13" text-anchor="middle" font-weight="700">03</text>
<text x="65" y="296.2" class="t" font-size="15">CI grades every diff before it merges:</text>
<rect x="24" y="313.2" width="313.5" height="30" rx="6" class="bxg"/>
<text x="32" y="332.7" class="tg" font-size="13">takes access away: merges on one owner's click</text>
<rect x="347.5" y="313.2" width="197.3" height="30" rx="6" class="bxw"/>
<text x="355.5" y="332.7" class="tw" font-size="13">gives access: waits for review</text>
<rect x="24" y="360.2" width="31" height="30" rx="15" class="fa"/>
<text x="39.5" y="379.8" class="ton" font-size="13" text-anchor="middle" font-weight="700">04</text>
<text x="65" y="380.2" class="t" font-size="15">The dashboard is for looking: its door forwards reads only</text>
<rect x="24" y="397.2" width="143.7" height="30" rx="6" class="bx"/>
<text x="32" y="416.7" class="t" font-size="13" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace">mgmt-read.&lt;site&gt;</text>
<rect x="177.7" y="397.2" width="147.5" height="30" rx="6" class="bxg"/>
<text x="185.7" y="416.7" class="tg" font-size="13">GET /api/groups  200</text>
<rect x="335.2" y="397.2" width="82.9" height="30" rx="6" class="bxc"/>
<text x="343.2" y="416.7" class="tc" font-size="13">POST  403</text>
<rect x="24" y="444.2" width="31" height="30" rx="15" class="fa"/>
<text x="39.5" y="463.8" class="ton" font-size="13" text-anchor="middle" font-weight="700">06</text>
<text x="65" y="464.2" class="t" font-size="15" data-role="note">“Why can't A reach B?” goat warrant why-blocked reads the declared ACL first</text>
</svg>
