      - PUBLIC-INFRA
      - HANDSET
      - SENSOR-FEED
      - SENSOR-TASKING
      - SENSOR-TELEMETRY
      - SENSOR-ARBITER
      - EFFECTOR-CUE
      - EFFECTOR-TRACK
      - EFFECTOR-TELEMETRY
